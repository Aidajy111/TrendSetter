version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  # Микросервис авторизации
  auth-service:
    build: 
      context: .
      dockerfile: cmd/auth-service/Dockerfile
    environment:
      DB_URL: "postgres://user:password@postgres:5432/auth_db"
    depends_on:
      - postgres

  # Сервис примерки 
  tryon-service:
    build:
      context: .
      dockerfile: cmd/tryon-service/Dockerfile
    environment:
      DB_URL: "postgres://user:password@postgres:5432/tryon_db"
    depends_on:
      - postgres